apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service
  namespace: vehicle-system
  labels:
    app: vehicle-service
spec:
  replicas: 1
  revisionHistoryLimit: 5        # old versions are kept so rollback works
  selector:
    matchLabels:
      app: vehicle-service
  template:
    metadata:
      labels:
        app: vehicle-service
    spec:
      containers:
        - name: vehicle-service
          image: vehicle-service:latest    # Jenkins replaces this with the versioned tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
