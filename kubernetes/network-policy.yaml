# Network policy: only allow traffic from monitoring namespace and within the app namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vehicle-rental-network-policy
  namespace: vehicle-rental-system
spec:
  podSelector:
    matchLabels:
      app: vehicle-rental-service
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the same namespace
    - from:
        - podSelector: {}
    # Allow traffic from monitoring namespace (Prometheus scraping)
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000
