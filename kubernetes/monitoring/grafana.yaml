---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/vehicle-rental.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datasource-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-volume
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource-volume
          configMap:
            name: grafana-datasource
        - name: provider-volume
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-volume
          configMap:
            name: grafana-dashboard-vehicle-rental
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 1002
      targetPort: 3000
    - name: internal
      port: 3000
      targetPort: 3000
  type: ClusterIP