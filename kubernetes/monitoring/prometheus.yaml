apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: vehicle-rental-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - vehicle-rental-service.vehicle-rental-system.svc.cluster.local:8000
  alerts.yml: |
    groups:
      - name: vehicle-rental-alerts
        rules:
          - alert: ServiceDown
            expr: up{job="vehicle-rental-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Vehicle Rental Service is DOWN"
              description: "The vehicle-rental-service has been unreachable for more than 1 minute."
          - alert: HighErrorRate
            expr: >
              sum(rate(http_requests_total{job="vehicle-rental-service", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{job="vehicle-rental-service"}[5m])) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP error rate detected"
              description: "More than 5% of requests are returning 5xx status codes."
          - alert: HighLatency
            expr: >
              (sum(rate(http_request_duration_seconds_sum{job="vehicle-rental-service"}[5m]))
              / sum(rate(http_request_duration_seconds_count{job="vehicle-rental-service"}[5m]))) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High API latency detected"
              description: "Average response time has exceeded 500ms for 5 minutes."
          - alert: HighMemoryUsage
            expr: >
              process_resident_memory_bytes{job="vehicle-rental-service"}
              / 268435456 > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Application memory usage exceeds 80% of the 256Mi limit."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-lifecycle"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 1000
      targetPort: 9090
    - name: internal
      port: 9090
      targetPort: 9090
  type: ClusterIP